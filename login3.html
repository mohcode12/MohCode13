<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    position: relative;
    width: 100%;
    max-width: 1200px;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-box {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    padding: 50px 40px;
    width: 100%;
    max-width: 450px;
    animation: slideIn 0.6s ease-out;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.form-header {
    text-align: center;
    margin-bottom: 40px;
}

.form-header h1 {
    color: #333;
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 10px;
}

.form-header p {
    color: #999;
    font-size: 16px;
}

.login-form {
    display: flex;
    flex-direction: column;
    gap: 25px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.form-group label {
    color: #333;
    font-weight: 600;
    font-size: 14px;
}

.input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.input-wrapper .icon {
    position: absolute;
    right: 15px;
    font-size: 20px;
    pointer-events: none;
}

.input-wrapper input {
    width: 100%;
    padding: 14px 50px 14px 15px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    font-size: 15px;
    transition: all 0.3s ease;
    background-color: #f8f9fa;
    color: #333;
}

.input-wrapper input:focus {
    outline: none;
    border-color: #667eea;
    background-color: #fff;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.input-wrapper input::placeholder {
    color: #bbb;
}

.toggle-password {
    position: absolute;
    left: 15px;
    cursor: pointer;
    font-size: 18px;
    opacity: 0.6;
    transition: opacity 0.3s;
}

.toggle-password:hover {
    opacity: 1;
}

.error-message {
    color: #e74c3c;
    font-size: 12px;
    display: none;
}

.error-message.show {
    display: block;
}

.form-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
}

.remember-me {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    color: #555;
}

.remember-me input[type="checkbox"] {
    cursor: pointer;
    width: 18px;
    height: 18px;
    accent-color: #667eea;
}

.forgot-password {
    color: #667eea;
    text-decoration: none;
    transition: color 0.3s;
}

.forgot-password:hover {
    color: #764ba2;
    text-decoration: underline;
}

.btn-login {
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    color: white;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 10px;
}

.btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
}

.btn-login:active {
    transform: translateY(0);
}

.divider {
    text-align: center;
    color: #ccc;
    margin: 25px 0;
    position: relative;
}

.divider::before,
.divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 40%;
    height: 1px;
    background-color: #e0e0e0;
}

.divider::before {
    right: 0;
}

.divider::after {
    left: 0;
}

.social-login {
    display: flex;
    gap: 15px;
}

.social-btn {
    flex: 1;
    padding: 12px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    background-color: white;
    color: #333;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 14px;
}

.social-btn:hover {
    border-color: #667eea;
    background-color: #f8f9ff;
}

.social-btn.google:hover {
    color: #667eea;
}

.social-btn.facebook:hover {
    color: #667eea;
}

.signup-link {
    text-align: center;
    color: #666;
    font-size: 14px;
    margin-top: 20px;
}

.signup-link a {
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s;
}

.signup-link a:hover {
    color: #764ba2;
}

.decoration {
    position: absolute;
    width: 300px;
    height: 300px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    top: -150px;
    left: -150px;
    animation: float 6s ease-in-out infinite;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0px);
    }
    50% {
        transform: translateY(20px);
    }
}

@media (max-width: 600px) {
    .login-box {
        padding: 30px 25px;
        max-width: 100%;
        margin: 20px;
    }

    .form-header h1 {
        font-size: 26px;
    }

    .social-login {
        flex-direction: column;
    }

    .decoration {
        display: none;
    }
}
  </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="form-header">
                <h1>مرحباً بك</h1>
                <p>تسجيل الدخول إلى حسابك</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <span class="icon">✉️</span>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="أدخل بريدك الإلكتروني"
                            required
                        >
                    </div>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-wrapper">
                        <span class="icon">🔒</span>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="أدخل كلمة المرور"
                            required
                        >
                        <span class="toggle-password" onclick="togglePassword()">👁️</span>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-footer">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>تذكر بياناتي</span>
                    </label>
                    <a href="#" class="forgot-password">هل نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="btn-login">تسجيل الدخول</button>
            </form>

            <div class="divider">أو</div>

            <div class="social-login">
                <button type="button" class="social-btn google">
                    <span>Google</span>
                </button>
                <button type="button" class="social-btn facebook">
                    <span>Facebook</span>
                </button>
            </div>

            <div class="signup-link">
                لا تملك حساباً؟ <a href="#">إنشاء حساب جديد</a>
            </div>
        </div>

        <div class="decoration"></div>
    </div>

    <script>
  // التحقق من صحة البريد الإلكتروني
function isValidEmail(email) {
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return emailRegex.test(email);
}

// التحقق من صحة كلمة المرور
function isValidPassword(password) {
    return password.length >= 6;
}

// إظهار/إخفاء رسالة الخطأ
function showError(elementId, message) {
    const errorElement = document.getElementById(elementId);
    errorElement.textContent = message;
    errorElement.classList.add('show');
}

// إخفاء رسالة الخطأ
function hideError(elementId) {
    const errorElement = document.getElementById(elementId);
    errorElement.textContent = '';
    errorElement.classList.remove('show');
}

// تبديل ظهور كلمة المرور
function togglePassword() {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.querySelector('.toggle-password');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleBtn.textContent = '🙈';
    } else {
        passwordInput.type = 'password';
        toggleBtn.textContent = '👁️';
    }
}

// معالجة نموذج التسجيل
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    
    let isValid = true;
    
    // التحقق من البريد الإلكتروني
    if (!email) {
        showError('emailError', 'البريد الإلكتروني مطلوب');
        isValid = false;
    } else if (!isValidEmail(email)) {
        showError('emailError', 'البريد الإلكتروني غير صحيح');
        isValid = false;
    } else {
        hideError('emailError');
    }
    
    // التحقق من كلمة المرور
    if (!password) {
        showError('passwordError', 'كلمة المرور مطلوبة');
        isValid = false;
    } else if (!isValidPassword(password)) {
        showError('passwordError', 'كلمة المرور يجب أن تكون 6 أحرف على الأقل');
        isValid = false;
    } else {
        hideError('passwordError');
    }
    
    // إذا كانت البيانات صحيحة
    if (isValid) {
        // هنا يمكنك إرسال البيانات إلى الخادم
        console.log('البيانات الصحيحة:');
        console.log('البريد الإلكتروني:', email);
        console.log('كلمة المرور:', password);
        
        // إظهار رسالة نجاح
        alert('تم تسجيل الدخول بنجاح! ✓');
        
        // إعادة تعيين النموذج (اختياري)
        // this.reset();
    }
});

// مسح رسائل الخطأ عند الكتابة
document.getElementById('email').addEventListener('input', function() {
    if (this.value.trim()) {
        hideError('emailError');
    }
});

document.getElementById('password').addEventListener('input', function() {
    if (this.value) {
        hideError('passwordError');
    }
});

// معالجة أزرار تسجيل الدخول الاجتماعية
document.querySelector('.social-btn.google').addEventListener('click', function() {
    console.log('تسجيل دخول عبر Google');
    alert('سيتم إعادة التوجيه إلى Google للتحقق...');
});

document.querySelector('.social-btn.facebook').addEventListener('click', function() {
    console.log('تسجيل دخول عبر Facebook');
    alert('سيتم إعادة التوجيه إلى Facebook للتحقق...');
});

// معالجة رابط نسيان كلمة المرور
document.querySelector('.forgot-password').addEventListener('click', function(e) {
    e.preventDefault();
    alert('سيتم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني');
});

// معالجة رابط إنشاء حساب جديد
document.querySelector('.signup-link a').addEventListener('click', function(e) {
    e.preventDefault();
    alert('سيتم التوجه إلى صفحة إنشاء حساب جديد');
});
  </script>
</body>
</html>
