<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            opacity: 0.05;
        }

        .shape1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border-radius: 50%;
            top: -100px;
            right: -100px;
            animation: float 8s ease-in-out infinite;
        }

        .shape2 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #ff006e, #fb5607);
            border-radius: 30%;
            bottom: -50px;
            left: -50px;
            animation: float 6s ease-in-out infinite reverse;
        }

        .shape3 {
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, #06ffa5, #00d4ff);
            border-radius: 40%;
            top: 50%;
            left: 10%;
            animation: float 7s ease-in-out infinite;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(30px, -30px) rotate(90deg);
            }
            50% {
                transform: translate(0, -60px) rotate(180deg);
            }
            75% {
                transform: translate(-30px, -30px) rotate(270deg);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            padding: 20px;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-form {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 50px 40px;
            background: rgba(20, 30, 60, 0.7);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.1);
            animation: slideInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-title {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .form-subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-weight: 400;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 24px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .input-wrapper input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .input-wrapper input:hover:not(:focus) {
            border-color: rgba(0, 212, 255, 0.3);
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 32px 0;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #00d4ff;
        }

        .remember-me label {
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            user-select: none;
        }

        .forgot-password {
            color: #00d4ff;
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 500;
        }

        .forgot-password:hover {
            color: #00ffff;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #0a0e27;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.3), transparent);
            margin: 30px 0;
        }

        .signup-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }

        .signup-text a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .signup-text a:hover {
            color: #00ffff;
        }

        @media (max-width: 480px) {
            .login-form {
                padding: 35px 25px;
                border-radius: 16px;
            }

            .form-title {
                font-size: 24px;
            }

            .input-wrapper input {
                padding: 12px 14px;
                font-size: 13px;
            }

            .submit-btn {
                padding: 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="animated-bg">
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <div class="shape shape3"></div>
    </div>

    <div class="container">
        <div class="login-container">
            <form class="login-form">
                <div class="form-header">
                    <h1 class="form-title">مرحباً بك</h1>
                    <p class="form-subtitle">سجل دخولك للمتابعة</p>
                </div>

                <div class="input-wrapper">
                    <input type="email" placeholder="البريد الإلكتروني" required>
                </div>

                <div class="input-wrapper">
                    <input type="password" placeholder="كلمة المرور" required>
                </div>

                <div class="options">
                    <label class="remember-me">
                        <input type="checkbox">
                        <label>تذكرني</label>
                    </label>
                    <a href="#" class="forgot-password">هل نسيت؟</a>
                </div>

                <button type="submit" class="submit-btn">دخول</button>

                <div class="divider"></div>

                <div class="signup-text">
                    ليس لديك حساب؟ <a href="#">أنشئ واحداً الآن</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
