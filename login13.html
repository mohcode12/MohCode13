<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-container {
            display: flex;
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .left-section {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .left-section::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            bottom: -100px;
            right: -100px;
        }

        .left-section::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -50px;
            left: -50px;
        }

        .left-content {
            position: relative;
            z-index: 1;
        }

        .left-icon {
            font-size: 80px;
            margin-bottom: 30px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .left-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .left-text {
            font-size: 15px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .right-section {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-title {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .form-subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 35px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-group input::placeholder {
            color: #ccc;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            background: #f8f8ff;
        }

        .checkbox-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0 30px 0;
            font-size: 13px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            cursor: pointer;
        }

        .checkbox-label input {
            accent-color: #667eea;
            cursor: pointer;
        }

        .forgot-link {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .forgot-link:hover {
            color: #764ba2;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .signup-section {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #999;
        }

        .signup-section a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .signup-section a:hover {
            color: #764ba2;
        }

        .or-divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
        }

        .or-divider::before,
        .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #eee;
        }

        .or-text {
            padding: 0 10px;
            color: #ccc;
            font-size: 12px;
        }

        .social-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #eee;
            background: white;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .left-section {
                padding: 40px 30px;
            }

            .right-section {
                padding: 40px 30px;
            }

            .left-icon {
                font-size: 60px;
                margin-bottom: 20px;
            }

            .left-title {
                font-size: 24px;
            }

            .form-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="left-section">
            <div class="left-content">
                <div class="left-icon">🚀</div>
                <h2 class="left-title">أهلاً وسهلاً</h2>
                <p class="left-text">انضم إلى آلاف المستخدمين الذين يثقون بنا<br>واستمتع بتجربة رائعة</p>
            </div>
        </div>

        <div class="right-section">
            <h1 class="form-title">تسجيل الدخول</h1>
            <p class="form-subtitle">ادخل بيانات حسابك للمتابعة</p>

            <form>
                <div class="input-group">
                    <input type="email" placeholder="البريد الإلكتروني" required>
                </div>

                <div class="input-group">
                    <input type="password" placeholder="كلمة المرور" required>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox">
                        تذكر بيانات تسجيلي
                    </label>
                    <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="login-button">دخول</button>

                <div class="or-divider">
                    <span class="or-text">أو</span>
                </div>

                <div class="social-buttons">
                    <button type="button" class="social-btn">f</button>
                    <button type="button" class="social-btn">in</button>
                    <button type="button" class="social-btn">🔵</button>
                </div>

                <div class="signup-section">
                    ليس لديك حساب؟ <a href="#">أنشئ واحداً الآن</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
