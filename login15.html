<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بوابة الدخول المستقبلية</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

body {
  margin: 0;
  padding: 0;
  background: radial-gradient(ellipse at center, #0f0f0f 0%, #000000 100%);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Orbitron', sans-serif;
  color: #00fff7;
}

.login-container {
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(15px);
  border: 2px solid #00fff7;
  border-radius: 20px;
  padding: 40px 30px;
  width: 350px;
  box-shadow: 0 0 20px #00fff7;
  position: relative;
  animation: fadeIn 1s ease forwards;
}

.login-container h2 {
  text-align: center;
  margin-bottom: 30px;
  color: #00fff7;
  text-shadow: 0 0 10px #00fff7;
}

.input-group {
  position: relative;
  margin-bottom: 30px;
}

.input-group input {
  width: 100%;
  padding: 10px 10px 10px 0;
  background: transparent;
  border: none;
  border-bottom: 2px solid #00fff7;
  color: #fff;
  outline: none;
  font-size: 16px;
}

.input-group label {
  position: absolute;
  left: 0;
  top: 10px;
  color: #00fff7;
  pointer-events: none;
  transition: 0.3s ease;
}

.input-group input:focus ~ label,
.input-group input:valid ~ label {
  top: -20px;
  font-size: 12px;
  color: #fff;
}

button {
  width: 100%;
  padding: 10px;
  background: #00fff7;
  color: #000;
  font-weight: bold;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s ease;
  box-shadow: 0 0 10px #00fff7, 0 0 40px #00fff7;
}

button:hover {
  background: #000;
  color: #00fff7;
  box-shadow: 0 0 15px #00fff7, 0 0 50px #00fff7;
}

#message {
  margin-top: 20px;
  text-align: center;
  font-size: 14px;
  color: #ff4d4d;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: scale(0.9);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
  </style>
</head>
<body>
  <div class="login-container">
    <h2>🚀 بوابة الدخول</h2>
    <form id="loginForm">
      <div class="input-group">
        <input type="text" id="username" required>
        <label for="username">اسم المستخدم</label>
      </div>
      <div class="input-group">
        <input type="password" id="password" required>
        <label for="password">كلمة المرور</label>
      </div>
      <button type="submit">دخول</button>
      <p id="message"></p>
    </form>
  </div>

  <script>
  document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const message = document.getElementById("message");

  // خيال علمي: اسم مستخدم سري ومفتاح دخول!
  if (username === "neo" && password === "matrix123") {
    message.style.color = "#00ff88";
    message.textContent = "✅ تم الدخول بنجاح. مرحبًا بك في النظام.";
  } else {
    message.style.color = "#ff4d4d";
    message.textContent = "❌ بيانات الدخول غير صحيحة. حاول مرة أخرى.";
  }
});
  </script>
</body>
</html>
