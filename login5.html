<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة النخبة</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Amiri', serif;
    }

    body {
      height: 100vh;
      background: url('https://www.transparenttextures.com/patterns/dark-mosaic.png') repeat, linear-gradient(to bottom, #1a1a1a, #000000);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f5f5f5;
    }

    .login-container {
      background: #111;
      padding: 40px 30px;
      border-radius: 15px;
      border: 2px solid #d4af37;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
      width: 380px;
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #d4af37;
      font-size: 26px;
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
    }

    .login-container p {
      text-align: center;
      margin-bottom: 30px;
      color: #bbb;
      font-size: 15px;
    }

    .input-group {
      position: relative;
      margin-bottom: 25px;
    }

    .input-group i {
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      color: #d4af37;
      font-size: 16px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px 12px 40px;
      background: #1e1e1e;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      outline: none;
      transition: 0.3s;
    }

    .input-group input:focus {
      border-color: #d4af37;
      box-shadow: 0 0 5px #d4af37;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #bfa136, #d4af37, #bfa136);
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    .login-btn:hover {
      box-shadow: 0 0 20px #d4af37;
      transform: scale(1.03);
    }

    .footer-note {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>بوابة النخبة</h2>
    <p>مرحباً بك في عالم الصفوة، الرجاء تسجيل الدخول لمتابعة رحلتك</p>
    <form>
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" placeholder="اسم العضو المميز">
      </div>
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" placeholder="رمز الدخول السري">
      </div>
      <button type="submit" class="login-btn">ادخل القصر</button>
    </form>
    <div class="footer-note">
      © 2025 نادي النخبة الرقمي
    </div>
  </div>

</body>
</html>
